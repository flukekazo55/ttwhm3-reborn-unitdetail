<ng-container *ngIf="vm$ | async as vm">
  <div class="faction-page">
    <header class="page-header">
      <div class="container-xl py-4 py-lg-5">
        <div class="eyebrow">TOTAL WAR: WARHAMMER III</div>
        <h1>{{ pageTitle }}</h1>
        <p>Lord compare · Skill build ถึง Lv 50 · Unit cards · Detailed stats</p>
      </div>
    </header>

    <main class="container-xl py-4">
      <div class="loading-box" *ngIf="vm.loading">
        <p-progressSpinner strokeWidth="4"></p-progressSpinner>
        <span>กำลังโหลดข้อมูล {{ pageTitle }}...</span>
      </div>

      <div class="alert alert-danger" role="alert" *ngIf="vm.error">
        {{ vm.error }}
      </div>

      <app-guide-faction *ngIf="vm.faction as faction" [faction]="faction"></app-guide-faction>
    </main>
  </div>
</ng-container>
