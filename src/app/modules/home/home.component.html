<main class="home">
  <section class="home-hero container-xl">
    <div class="step-pill">STEP 1 / 3 · เลือก Faction</div>
    <h1>วันนี้อยากเล่นเผ่าไหนดี? 🎮</h1>
    <p>เลือก Faction ที่ชอบก่อน เดี๋ยวเราพาไปเลือก Lord แล้วดูคู่มือแบบละเอียดกันต่อ</p>
  </section>

  <section class="faction-grid container-xl">
    <a
      *ngFor="let faction of factions; trackBy: trackFaction"
      class="faction-card"
      [class.faction-dark]="faction.dark"
      [routerLink]="['/', faction.id]"
      [style.--accent]="faction.accent"
      [style.--soft]="faction.soft">
      <div class="card-art">
        <img class="card-emblem" [src]="faction.emblem" [alt]="faction.name + ' emblem'" loading="lazy">
        <img
          *ngIf="!failedArt.has(faction.id)"
          [src]="faction.art"
          [alt]="faction.name"
          loading="lazy"
          (error)="onArtError(faction.id)">
        <div class="art-fallback" *ngIf="failedArt.has(faction.id)">{{ faction.name }}</div>
      </div>
      <div class="card-body">
        <span class="card-eyebrow">{{ faction.subtitle }}</span>
        <h2>{{ faction.name }}</h2>
        <p>{{ faction.blurb }}</p>
        <span class="card-cta">เลือกเผ่านี้ <b>→</b></span>
      </div>
    </a>
  </section>
</main>
