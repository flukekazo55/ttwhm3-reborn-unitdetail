<section
  class="faction-hero"
  [style.--accent]="faction.theme.accent"
  [style.--soft]="faction.theme.soft"
  [style.--border]="faction.theme.border">
  <div class="faction-label">FACTION GUIDE</div>
  <h2>{{ faction.name }}</h2>
  <strong>{{ faction.subtitle }}</strong>
  <p>{{ faction.description }}</p>
</section>

<section class="compare-section" [style.--accent]="faction.theme.accent">
  <div class="section-heading">
    <span>QUICK COMPARE</span>
    <h3>เลือก Lord ตัวไหนดี?</h3>
    <p class="section-sub">แตะที่การ์ดเพื่อดูคู่มือแบบละเอียดของ Lord ตัวนั้น</p>
  </div>

  <div class="compare-grid">
    <button
      type="button"
      class="compare-card"
      *ngFor="let lord of faction.lords; trackBy: trackLord"
      [class.active]="lord.id === selectedLordId"
      (click)="selectLord(lord.id)">
      <div class="compare-card-head">
        <span class="compare-name">{{ lord.name }}</span>
        <span class="compare-tag">{{ lord.tag }}</span>
      </div>
      <dl class="compare-meta">
        <div><dt>เหมาะกับ</dt><dd>{{ lord.bestFor }}</dd></div>
        <div><dt>สไตล์</dt><dd>{{ lord.style }}</dd></div>
        <div><dt>Core unit</dt><dd>{{ getCoreUnitNames(lord) }}</dd></div>
      </dl>
      <span class="compare-cta">ดูคู่มือ →</span>
    </button>
  </div>
</section>

<nav class="lord-tabs" [style.--accent]="faction.theme.accent" aria-label="เลือก Lord">
  <button
    type="button"
    class="lord-tab"
    *ngFor="let lord of faction.lords; trackBy: trackLord"
    [class.active]="lord.id === selectedLordId"
    (click)="selectLord(lord.id)">
    <span class="lord-tab-name">{{ lord.name }}</span>
    <span class="lord-tab-tag">{{ lord.tag }}</span>
  </button>
</nav>

<app-guide-lord
  *ngIf="selectedLord as lord"
  [lord]="lord"
  [accent]="faction.theme.accent"
  [soft]="faction.theme.soft"
  [border]="faction.theme.border">
</app-guide-lord>
